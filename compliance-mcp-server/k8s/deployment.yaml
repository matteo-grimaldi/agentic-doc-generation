apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-mcp-server
  namespace: doc-gen-demo
  labels:
    app: compliance-mcp-server
    app.kubernetes.io/name: compliance-mcp-server
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliance-mcp-server
  template:
    metadata:
      labels:
        app: compliance-mcp-server
    spec:
      containers:
        - name: compliance-mcp-server
          image: image-registry.openshift-image-registry.svc:5000/doc-gen-demo/compliance-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: MCP_PORT
              value: "8080"
            - name: GOVERNANCE_HUB_URL
              value: "http://governance-hub.doc-gen-demo.svc.cluster.local:7860"
            - name: PYTHONUNBUFFERED
              value: "1"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 4
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-mcp-server
  namespace: doc-gen-demo
  labels:
    app: compliance-mcp-server
spec:
  selector:
    app: compliance-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
