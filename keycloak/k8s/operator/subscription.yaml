# RHBK (Red Hat Build of Keycloak) operator subscription.
# Automatic install plan: operator upgrades are applied without manual approval,
# which is appropriate for a demo stack.
# Ref: https://docs.redhat.com/en/documentation/red_hat_build_of_keycloak/26.0/html/operator_guide/
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: rhbk-operator
  channel: stable-v26
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
