apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp-server
  namespace: doc-gen-demo
  labels:
    app: github-mcp-server
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-mcp-server
  template:
    metadata:
      labels:
        app: github-mcp-server
    spec:
      containers:
        - name: github-mcp-server
          image: image-registry.openshift-image-registry.svc:5000/doc-gen-demo/github-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: MCP_PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            # Optional: raises GitHub API rate limits and is required for
            # search_code. Create with:
            #   oc create secret generic github-token \
            #     --from-literal=token=<ghp_...> -n doc-gen-demo
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 4
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp-server
  namespace: doc-gen-demo
  labels:
    app: github-mcp-server
spec:
  selector:
    app: github-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
