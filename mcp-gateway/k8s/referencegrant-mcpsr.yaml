# Allow MCPServerRegistration in mcp-gateway to reference HTTPRoutes in
# doc-gen-demo (cross-namespace targetRef).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mcp-gateway-registrations
  namespace: doc-gen-demo
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  from:
    - group: mcp.kuadrant.io
      kind: MCPServerRegistration
      namespace: mcp-gateway
  to:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
