# Allow HTTPRoutes in mcp-gateway to reference MCP server Services in
# doc-gen-demo (cross-namespace backendRefs).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mcp-gateway-to-mcp-services
  namespace: doc-gen-demo
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: mcp-gateway
  to:
    - group: ""
      kind: Service
