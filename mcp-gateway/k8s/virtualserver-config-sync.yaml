# MCP Gateway Operator 0.7.1 writes MCPVirtualServer entries into
# Secret/mcp-gateway-config under the hardcoded namespace mcp-system, while
# the broker (owned by MCPGatewayExtension) mounts the secret in
# mcp-gateway. Without copying virtualServers into the broker secret,
# X-Mcp-Virtualserver filtering sees an empty list and agents get
# servers:[] / "tool not available".
#
# PostSync Job rebuilds virtualServers from MCPVirtualServer CRs in
# mcp-gateway and patches the broker secret (then restarts the broker).
# Also ensures namespace/mcp-system exists so the operator's VS reconcile
# does not fail with "namespaces mcp-system not found".
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-system
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-virtualserver-config-sync
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-virtualserver-config-sync
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["mcp-gateway-config"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mcp-gateway"]
    verbs: ["get", "patch"]
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpvirtualservers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-virtualserver-config-sync
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-virtualserver-config-sync
subjects:
  - kind: ServiceAccount
    name: mcp-virtualserver-config-sync
    namespace: mcp-gateway
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mcp-virtualserver-config-sync
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-virtualserver-config-sync
    spec:
      serviceAccountName: mcp-virtualserver-config-sync
      restartPolicy: OnFailure
      containers:
        - name: sync
          # UBI has python3; kubectl via oc symlink is not present — use
          # the OpenShift CLI image and a pure-bash+oc JSONPath merge.
          image: quay.io/openshift/origin-cli:4.16
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          command:
            - /bin/bash
            - -ec
            - |
              set -euo pipefail
              NS=mcp-gateway
              SECRET=mcp-gateway-config
              for i in $(seq 1 60); do
                oc get secret "${SECRET}" -n "${NS}" >/dev/null 2>&1 && break
                sleep 5
              done
              # Build virtualServers YAML from CRs (namespace/name + tools).
              VS_FILE=/tmp/vs.yaml
              echo "virtualServers:" > "${VS_FILE}"
              count=0
              while IFS=$'\t' read -r name tools; do
                [[ -z "${name}" ]] && continue
                count=$((count+1))
                echo "- name: ${NS}/${name}" >> "${VS_FILE}"
                echo "  tools:" >> "${VS_FILE}"
                # tools is JSON array like ["a","b"]
                echo "${tools}" | tr -d '[]"' | tr ',' '\n' | while read -r t; do
                  t=$(echo "${t}" | tr -d ' ')
                  [[ -z "${t}" ]] && continue
                  echo "  - ${t}" >> "${VS_FILE}"
                done
              done < <(oc get mcpvirtualserver -n "${NS}" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.tools}{"\n"}{end}')
              if [[ "${count}" -eq 0 ]]; then
                echo "no MCPVirtualServer CRs yet; skip"
                exit 0
              fi
              oc get secret "${SECRET}" -n "${NS}" -o jsonpath='{.data.config\.yaml}' | base64 -d > /tmp/cfg.yaml
              # Drop existing virtualServers block (through EOF), append ours.
              awk '
                BEGIN {skip=0}
                /^virtualServers:/ {skip=1; next}
                skip==1 && /^[^ \t-]/ && !/^$/ {skip=0}
                skip==0 {print}
              ' /tmp/cfg.yaml > /tmp/cfg-novs.yaml
              # Ensure trailing newline then append
              sed -i -e '$a\' /tmp/cfg-novs.yaml 2>/dev/null || true
              cat /tmp/cfg-novs.yaml "${VS_FILE}" > /tmp/merged.yaml
              B64=$(base64 -w0 /tmp/merged.yaml 2>/dev/null || base64 /tmp/merged.yaml | tr -d '\n')
              oc patch secret "${SECRET}" -n "${NS}" --type=merge -p "{\"data\":{\"config.yaml\":\"${B64}\"}}"
              oc rollout restart deployment/mcp-gateway -n "${NS}"
              echo "synced ${count} virtualServer(s) into ${SECRET} and restarted broker"
              cat /tmp/merged.yaml
