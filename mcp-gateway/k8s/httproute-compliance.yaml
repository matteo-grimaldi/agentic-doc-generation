# Gateway API discovery route for compliance-mcp-server's /mcp transport.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: compliance-mcp-server-mcp
  namespace: doc-gen-demo
  labels:
    app.kubernetes.io/name: compliance-mcp-server
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
      namespace: mcp-gateway
      sectionName: mcp
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: compliance-mcp-server
          port: 8080
