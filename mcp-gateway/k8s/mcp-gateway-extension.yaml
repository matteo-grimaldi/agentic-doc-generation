# Binds MCP protocol handling to Gateway/mcp-gateway listener `mcp`.
# Requires the MCP Gateway Operator CRDs from ./install-mcp-gateway.sh
# (spec.targetRef shape — older gatewayRef-only CRDs are rejected by that
# install script). httpRouteManagement Enabled lets the controller own
# the broker /mcp HTTPRoute.
# MCP Gateway Operator package (preview / mcp-gateway.v0.7.1) registers
# this CRD as mcp.kuadrant.io/v1alpha1 (Connectivity Link 1.5 docs may
# show /v1 — prefer the version the installed CRD actually serves).
#
# publicHost mirrors the Gateway listener hostname (required when that
# hostname is the ClusterIP Service FQDN). privateHost overrides the
# operator default (<gateway>-istio.…), which is wrong for OpenShift's
# {gateway}-openshift-default Service naming.
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  httpRouteManagement: Enabled
  publicHost: mcp-gateway-openshift-default.mcp-gateway.svc.cluster.local
  privateHost: mcp-gateway-openshift-default.mcp-gateway.svc.cluster.local:8080
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    namespace: mcp-gateway
    sectionName: mcp
