# Allow HTTPRoutes in doc-gen-demo to attach to Gateway mcp-gateway
# (cross-namespace parentRefs).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-doc-gen-demo-httproutes
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: doc-gen-demo
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
