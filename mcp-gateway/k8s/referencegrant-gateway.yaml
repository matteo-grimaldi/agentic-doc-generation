# Retained for any leftover doc-gen-demo HTTPRoutes attaching to Gateway
# mcp-gateway (cross-namespace parentRefs). Backend discovery routes now
# live in mcp-gateway itself; this grant is harmless if unused.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-doc-gen-demo-httproutes
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: doc-gen-demo
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
