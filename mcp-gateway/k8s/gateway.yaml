# In-cluster MCP Gateway. Class openshift-default is the Ingress Operator's
# Gateway API class (controller openshift.io/gateway-controller/v1).
# ./install-mcp-gateway.sh creates that GatewayClass if missing.
#
# infrastructure.parametersRef → mcp-gateway-options forces ClusterIP (no
# cloud LoadBalancer; otherwise Programmed stays False on this cluster).
#
# Two listeners on :8080:
#   mcp          — client / broker Host (Service DNS); MCPGatewayExtension
#                  sectionName + agents' MCP_GATEWAY_URL.
#   mcp-backends — wildcard for MCPServerRegistration HTTPRoutes, which
#                  require distinct hostnames (github-mcp-server.mcp.local,
#                  …). A single precise listener hostname rejects those
#                  routes (NoMatchingListenerHostname).
# kuadrant.io/gateway enables RHCL policy attachment.
#
# After install-openshift-ai.sh enables Authorino listener TLS for MaaS, Envoy
# must use TLS to Authorino:50051 (kuadrant-auth-service). Same annotation as
# ai-gateway/k8s/gateway.yaml — without it TokenReview auth returns 500.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: mcp-gateway
  labels:
    app.kubernetes.io/name: mcp-gateway
    app.kubernetes.io/part-of: agentic-doc-generation
    kuadrant.io/gateway: "true"
  annotations:
    security.opendatahub.io/authorino-tls-bootstrap: "true"
spec:
  gatewayClassName: openshift-default
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: mcp-gateway-options
  listeners:
    - name: mcp
      hostname: mcp-gateway-openshift-default.mcp-gateway.svc.cluster.local
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: mcp-backends
      hostname: "*.mcp.local"
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
