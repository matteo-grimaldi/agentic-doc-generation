# Gateway API discovery route for github-mcp-server's /mcp transport.
# Does not front REST routes (/propose-doc, /repo-structure) — those stay
# on the Service DNS used by GITHUB_MCP_SERVER_URL.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-mcp-server-mcp
  namespace: doc-gen-demo
  labels:
    app.kubernetes.io/name: github-mcp-server
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: mcp-gateway
      namespace: mcp-gateway
      sectionName: mcp
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: github-mcp-server
          port: 8080
