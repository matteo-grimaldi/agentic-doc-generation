  - name: Compliance MCP Server
    provider: agentic-doc-generation
    version: "1.0.0"
    description: >-
      Read-only MCP server that lets other AI agents query the Governance
      Hub's documentation-compliance state ("does repo X have an
      architecture doc / OpenAPI spec?") without scraping its dashboard or
      touching its database. Every tool is a thin proxy over
      governance-hub's own REST API; it holds no state of its own.
    transports:
      - http
    deploymentMode: local
    repositoryUrl: https://github.com/YOUR_ORG/agentic-doc-generation.git
    documentationUrl: https://github.com/YOUR_ORG/agentic-doc-generation/blob/main/README.md
    artifacts:
      - uri: "oci://image-registry.openshift-image-registry.svc:5000/doc-gen-demo/compliance-mcp-server@sha256:e04b4db0c10b44c55369a935b452ebb3667c08bb09920e439c8ce98a6a2e5b9a"
    runtimeMetadata:
      defaultPort: 8080
      mcpPath: /mcp
      prerequisites:
        configMaps:
          - name: compliance-mcp-server-config
            description: >-
              Optional runtime configuration; GOVERNANCE_HUB_URL is
              required (points at the Governance Hub's REST API) and is
              normally supplied as a Deployment env var rather than this
              ConfigMap — see compliance-mcp-server/build-and-deploy.sh.
            mountAsFile: false
            required: false
            keys:
              - key: GOVERNANCE_HUB_URL
                description: >-
                  In-cluster URL of the Governance Hub service this
                  server proxies, e.g.
                  http://governance-hub.doc-gen-demo.svc.cluster.local:7860
                required: true
              - key: MCP_PORT
                description: Port the server listens on (defaults to 8080).
                required: false
                defaultContent: "8080"
    tools:
      - name: get_compliance_status
        description: >-
          Report whether a specific repository is compliant with the
          org's documentation governance policy (has an architecture doc
          and, if applicable, an OpenAPI spec).
        accessType: read_only
      - name: list_violations
        description: >-
          List every tracked repository with at least one compliance
          violation (missing architecture document or OpenAPI spec).
        accessType: read_only
      - name: list_tracked_repos
        description: >-
          List every repository currently tracked by the Governance Hub,
          with its current compliance status.
        accessType: read_only
      - name: get_repo_history
        description: >-
          Return the full history of doc-gen-agent / openapi-gen-agent
          runs recorded for a repository, including any resulting pull
          request URLs.
        accessType: read_only
