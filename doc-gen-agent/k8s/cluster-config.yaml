# Central place for the external model endpoint config consumed by the
# Deployment. This branch serves inference from an external, configurable
# OpenAI-compatible endpoint (no in-cluster model serving) — point
# model_base_url at your provider's OpenAI-compatible `/v1` base URL
# (vLLM, Ollama, Azure OpenAI gateway, OpenAI itself, etc.).
#
# model_name must be the FULL id the OGX sidecar publishes at /v1/models —
# i.e. "<provider_id>/<model_id>" from
# doc-gen-agent/ogx/stack_run_config.yaml's registered_resources.models
# entry (provider_id + "/" + model_id/provider_model_id), NOT the bare
# model_id. agent.py passes this value straight through as the `model`
# field on responses.create(), and OGX's model router requires either an
# exact match against a registered model's published id, or (as a
# fallback) a "<provider_id>/<provider_resource_id>" string it can split
# on "/" — a bare model_id matches neither and fails with
# ModelNotFoundError mid-stream.
# The API key for the endpoint is supplied separately via the
# external-model-credentials Secret (see k8s/deployment.yaml and the
# README) — never put it in this ConfigMap.
#
# ogx_mlflow_sidecar_image: default ogx-server image (must match all four agent
# Deployments' ogx-server container image). Override at deploy time with
# OGX_MLFLOW_SIDECAR_MODE=cluster to build in-cluster and patch to the
# namespace ImageStream instead.
#
# mlflow_tracking_uri: in-cluster or Route URL of the OpenShift AI MLflow
# tracking server (from the MLflow UI quickstart / Mlflow CR). Leave empty
# to disable tracing. Pods in doc-gen-demo must be able to reach this URI;
# optional auth goes in the mlflow-credentials Secret (never commit tokens):
#   oc create secret generic mlflow-credentials \
#     --from-literal=token="$(oc whoami -t)" -n doc-gen-demo
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: doc-gen-demo
data:
  model_name: "external-model/qwen38-27b"
  model_base_url: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  # Empty = MLflow tracing off. Example in-cluster form after
  # ./install-openshift-ai.sh creates the Mlflow CR:
  #   http://mlflow.redhat-ods-applications.svc.cluster.local:5000
  # (confirm Service name/namespace/port on your cluster — the MLflow UI
  # quickstart shows the URI to use). For https:// in-cluster Service URLs
  # (e.g. :8443), set mlflow_tracking_insecure_tls to "true" or use plain
  # http://…:5000 instead. Alternatively mount the service CA and set
  # MLFLOW_TRACKING_SERVER_CERT_PATH in the Deployment (not in ConfigMap).
  mlflow_tracking_uri: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow"
  # Literal "true" disables TLS verify for MLFLOW_TRACKING_URI (demo only).
  mlflow_tracking_insecure_tls: "true"
  # "false" (default): sidecar openai.autolog traces include prompts/Chat tab
  # (one trace row per model call). Set "true" only with ogx_mlflow_app middleware
  # to nest LLM spans under the Gradio agent trace (Chat tab may differ).
  mlflow_ogx_trace_propagation: "false"
  # LLM USD rates live in the MLflow Model Registry (not this ConfigMap).
  # Seed / update with ./register-llm-pricing.py — agents read
  # input_usd_per_million / output_usd_per_million tags from the Registered
  # Model named after model_name with "/" replaced by "--".
  ogx_mlflow_sidecar_image: "quay.io/mgrimald/ogx-mlflow-sidecar:latest"
  # In-cluster MCP Gateway /mcp URL for the four agents' OGX MCP tool.
  # Left empty in git; ./install-mcp-gateway.sh patches this after
  # Gateway mcp-gateway is Programmed (Argo CD ignoreDifferences on
  # doc-gen-agent Application keeps the live value). Agents fail closed
  # when empty rather than falling back to the direct MCP Service URL.
  mcp_gateway_url: ""
