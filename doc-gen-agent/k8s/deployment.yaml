---
# Note: the ogx-stack-config and agent-knowledge ConfigMaps are managed by
# build-and-deploy.sh via:
#   oc create configmap ogx-stack-config --from-file=stack_run_config.yaml=ogx/stack_run_config.yaml
#   oc create configmap agent-knowledge --from-file=knowledge.md=knowledge.md
# Do NOT inline them here to avoid YAML-within-YAML parsing issues.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-gen-agent
  namespace: doc-gen-demo
  labels:
    app: doc-gen-agent
    app.kubernetes.io/name: doc-gen-agent
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-gen-agent
  template:
    metadata:
      labels:
        app: doc-gen-agent
    spec:
      serviceAccountName: doc-gen-agent-sa
      containers:
        # ── OGX sidecar (default: Quay; cluster build via OGX_MLFLOW_SIDECAR_MODE=cluster) ──
        # Image ref is set by build-and-deploy.sh (see scripts/lib-ogx-sidecar-deploy.sh).
        - name: ogx-server
          image: quay.io/mgrimald/ogx-mlflow-sidecar:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8321
              name: ogx-http
              protocol: TCP
          env:
            - name: OGX_CONFIG
              value: "/etc/ogx/stack_run_config.yaml"
            - name: OGX_LOGGING
              value: "all=INFO"
            - name: SQLITE_STORE_DIR
              value: "/tmp/ogx"
            - name: INFERENCE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: model_base_url
            - name: INFERENCE_MAX_TOKENS
              value: "8192"
            # MaaS API key (sk-oai-...) for the in-cluster AI Gateway.
            # install-openshift-ai.sh mints one, or create with:
            #   oc create secret generic external-model-credentials \
            #     --from-literal=api_key=sk-oai-... -n doc-gen-demo
            # Optional only if you override; MaaS normally requires a key.
            # stack_run_config.yaml falls back to "unused" if absent.
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-model-credentials
                  key: api_key
                  optional: true
            - name: INFERENCE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: model_name
            - name: OPENAI_MAX_RETRIES
              value: "8"
            - name: PYTHONPATH
              value: /app/ogx-mlflow
            - name: OGX_MLFLOW_SERVICE_NAME
              value: "doc-gen-agent"
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: mlflow_tracking_uri
            - name: MLFLOW_TRACKING_INSECURE_TLS
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: mlflow_tracking_insecure_tls
                  optional: true
            - name: MLFLOW_OGX_TRACE_PROPAGATION
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: mlflow_ogx_trace_propagation
                  optional: true
            - name: MLFLOW_WORKSPACE
              value: "doc-gen-demo"
            - name: MLFLOW_EXPERIMENT
              value: "doc-gen-agent"
            # Optional — create with:
            #   oc create secret generic mlflow-credentials \
            #     --from-literal=token=<token> -n doc-gen-demo
            - name: MLFLOW_TRACKING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: token
                  optional: true
          volumeMounts:
            - name: ogx-config
              mountPath: /etc/ogx
            - name: ogx-data
              mountPath: /tmp/ogx
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8321
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8321
            initialDelaySeconds: 75
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
        # ── Gradio UI ────────────────────────────────────────────────────────
        - name: doc-gen-agent
          image: image-registry.openshift-image-registry.svc:5000/doc-gen-demo/doc-gen-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
              name: http
              protocol: TCP
          env:
            - name: GRADIO_PORT
              value: "7860"
            - name: GRADIO_ANALYTICS_ENABLED
              value: "False"
            - name: OGX_BASE_URL
              value: "http://localhost:8321"
            # Federated MCP endpoint (Connectivity Link MCP Gateway).
            # Populated by ./install-mcp-gateway.sh into cluster-config;
            # empty until then — agent.py fails closed (no direct-Service fallback).
            - name: MCP_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: mcp_gateway_url
            - name: MCP_VIRTUAL_SERVER
              value: "mcp-gateway/github-tools"
            - name: MCP_GATEWAY_TOKEN_PATH
              value: "/var/run/secrets/mcp-gateway/token"
            # Base URL (no /mcp suffix) of the GitHub MCP server Service —
            # REST only (/propose-doc). MCP tool traffic goes through the
            # gateway above, not this URL.
            - name: GITHUB_MCP_SERVER_URL
              value: "http://github-mcp-server.doc-gen-demo.svc.cluster.local:8080"
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: model_name
            - name: KNOWLEDGE_FILE
              value: "/etc/agent-knowledge/knowledge.md"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MAX_INFER_ITERS
              value: "20"
            - name: MAX_READ_FILES
              value: "8"
            # Optional: the Governance Hub component's callback endpoint
            # (see governance-hub/app.py's POST /api/runs) — leave this
            # empty (or remove the Deployment entirely) to run doc-gen-agent
            # with no governance tracking at all; reporting failures never
            # affect this agent's own run (see app.py's
            # _report_to_governance).
            - name: GOVERNANCE_HUB_URL
              value: "http://governance-hub.doc-gen-demo.svc.cluster.local:7860"
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: mlflow_tracking_uri
            - name: MLFLOW_TRACKING_INSECURE_TLS
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: mlflow_tracking_insecure_tls
                  optional: true
            - name: MLFLOW_OGX_TRACE_PROPAGATION
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: mlflow_ogx_trace_propagation
                  optional: true
            - name: MLFLOW_WORKSPACE
              value: "doc-gen-demo"
            - name: MLFLOW_EXPERIMENT
              value: "doc-gen-agent"
            - name: MLFLOW_TRACKING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mlflow-credentials
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: agent-knowledge
              mountPath: /etc/agent-knowledge
              readOnly: true
            - name: mcp-gateway-token
              mountPath: /var/run/secrets/mcp-gateway
              readOnly: true
      volumes:
        - name: ogx-config
          configMap:
            name: ogx-stack-config
        - name: ogx-data
          emptyDir: {}
        - name: agent-knowledge
          configMap:
            name: agent-knowledge
        # Projected SA token with audience matching AuthPolicy
        # (mcp-gateway/k8s/auth-policy.yaml). TokenReview needs no RoleBinding.
        - name: mcp-gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: mcp-gateway
                  expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: doc-gen-agent
  namespace: doc-gen-demo
  labels:
    app: doc-gen-agent
spec:
  selector:
    app: doc-gen-agent
  ports:
    - name: http
      port: 7860
      targetPort: 7860
      protocol: TCP
