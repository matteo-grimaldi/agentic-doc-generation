# The agent uses Kubernetes RBAC only to authorize its MLflow workspace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doc-gen-agent-sa
  namespace: doc-gen-demo
---
# MLflow checks these namespace-scoped pseudo-resources via Kubernetes RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: doc-gen-agent-mlflow
  namespace: doc-gen-demo
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments", "registeredmodels"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: doc-gen-agent-mlflow
  namespace: doc-gen-demo
subjects:
  - kind: ServiceAccount
    name: doc-gen-agent-sa
    namespace: doc-gen-demo
roleRef:
  kind: Role
  name: doc-gen-agent-mlflow
  apiGroup: rbac.authorization.k8s.io
