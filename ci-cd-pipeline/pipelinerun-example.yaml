# Example PipelineRun — Maven build + compliance-scan invoke (no image,
# no deploy, no Quay). Deliberately kept outside k8s/ (which is
# GitOps-synced) so ArgoCD never auto-creates a PipelineRun on sync.
#
# Prerequisites:
#   ./ci-cd-pipeline/install-operator.sh
#   ./ci-cd-pipeline/build-and-deploy.sh
#
# Workspace storage is provisioned per-run via volumeClaimTemplate (no
# pre-created PVC named ci-cd-pipeline-workspace is required).
#
#   oc create -f ci-cd-pipeline/pipelinerun-example.yaml -n ci-cd-demo
#
# Note: the target repo must be a Maven project (pom.xml at the root).
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-deploy-app-run-
  namespace: ci-cd-demo
spec:
  pipelineRef:
    name: build-deploy-app
  serviceAccountName: ci-cd-pipeline-sa
  params:
    - name: repo-url
      value: https://github.com/matteo-grimaldi/spring-petclinic-rest-legacy
    - name: repo-revision
      value: main
    - name: app-name
      value: spring-petclinic-rest-legacy
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
