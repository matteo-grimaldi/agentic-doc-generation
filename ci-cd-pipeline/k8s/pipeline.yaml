# Clone, Maven-build the Java application, fire a non-blocking
# compliance-scan-agent invocation, then a fake "deploy" step.
# After `mvn package`, POST /invoke returns 202 immediately and the scan
# runs in the background (reporting to Governance Hub). The final deploy
# Task is a no-op placeholder (logs success; creates no workload).
#
# The git-clone and maven Tasks come from the OpenShift Pipelines
# operator install (cluster resolver → openshift-pipelines namespace).
# Artifact Hub's tekton/git-clone package is not reliable from this
# cluster, so do not use the hub resolver here.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-deploy-app
  namespace: ci-cd-demo
spec:
  description: >-
    Clones a public Java/Maven repo, runs `mvn package` (tests skipped),
    triggers a non-blocking compliance-scan agent run, then a fake deploy
    step for the same repo revision. No real container image push or
    workload rollout.
  params:
    - name: repo-url
      type: string
      description: Public git repository URL to build and analyze.
    - name: repo-revision
      type: string
      description: Branch, tag, or commit to check out and hint to agents.
      default: main
    - name: app-name
      type: string
      description: Logical app name shown in the fake deploy log.
      default: app
    - name: maven-image-java-version
      type: string
      description: >-
        Java version for the OpenShift Pipelines maven Task
        (supported: 8, 11, 17, 21).
      default: "11"
    - name: compliance-scan-agent-url
      type: string
      description: compliance-scan-agent /invoke endpoint URL.
      default: "http://compliance-scan-agent.doc-gen-demo.svc.cluster.local:7860/invoke"
  workspaces:
    - name: shared-workspace
      description: Holds the cloned repo between fetch-source and maven-build.
  tasks:
    - name: fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.repo-revision)

    - name: maven-build
      runAfter:
        - fetch-source
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: maven
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: JAVA_VERSION
          value: $(params.maven-image-java-version)
        - name: GOALS
          value:
            - -B
            - -DskipTests
            - package

    # After the Maven build: invoke compliance-scan (fire-and-forget).
    - name: invoke-compliance-scan-agent
      runAfter:
        - maven-build
      taskRef:
        name: invoke-compliance-scan-agent
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: repo-revision
          value: $(params.repo-revision)
        - name: agent-url
          value: $(params.compliance-scan-agent-url)

    # Final step: fake rollout (no cluster changes).
    - name: deploy
      runAfter:
        - invoke-compliance-scan-agent
      taskRef:
        name: deploy
      params:
        - name: app-name
          value: $(params.app-name)
        - name: repo-url
          value: $(params.repo-url)
