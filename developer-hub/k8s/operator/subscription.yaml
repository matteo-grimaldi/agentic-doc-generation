# RHDH operator subscription.
# Manual install plan: the approve-installplan Job below allowlists exactly
# rhdh-operator.v1.10.6 to prevent uncontrolled upgrades during the demo.
# Ref: https://docs.redhat.com/en/documentation/red_hat_developer_hub/1.10
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhdh
  namespace: rhdh-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: rhdh
  channel: fast-1.10
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
  startingCSV: rhdh-operator.v1.10.6
