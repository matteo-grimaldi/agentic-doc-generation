# Placeholder Secret for RHDH runtime configuration.
# IMPORTANT: all values here are dummy placeholders — the configure-rhdh
# Sync Job (wave 18) patches this Secret with real values at deploy time:
#   SESSION_SECRET        — randomly generated
#   RHDH_BASE_URL         — discovered from the Backstage Route
#   RHBK_METADATA_URL     — discovered from the Keycloak Route
#   RHDH_OIDC_CLIENT_SECRET — generated and registered in RHBK by the Job
#   RHDH_ARGOCD_URL       — discovered from openshift-gitops-server Route
#   RHDH_ARGOCD_TOKEN     — read from rhdh-local-user Secret in openshift-gitops
#   RHDH_KUBERNETES_SA_TOKEN — read from rhdh-kubernetes-reader-token Secret
#   RHDH_PIPELINE_STARTER_TOKEN — read from rhdh-pipeline-starter-token Secret
#                           (create PipelineRuns in ci-cd-demo via /proxy/k8s)
#   DOC_GEN_AGENT_URL     — discovered from doc-gen-agent Route in doc-gen-demo
#   OPENAPI_GEN_AGENT_URL — discovered from openapi-gen-agent Route in doc-gen-demo
#   GITHUB_TOKEN          — GitHub PAT for integrations.github (catalog URL
#                           reads / catalog:register). A PLACEHOLDER value
#                           makes api.github.com return 401. Patch from
#                           doc-gen-demo/github-token out-of-band; never
#                           commit a real token. Do not oc-apply this file
#                           over a live Secret without re-running configure-rhdh
#                           and restoring GITHUB_TOKEN.
#
# ArgoCD ignoreDifferences on /data prevents drift loops when the Job patches it.
# Never commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
type: Opaque
stringData:
  SESSION_SECRET: "PLACEHOLDER"
  RHDH_BASE_URL: "https://placeholder.example.com"
  RHBK_METADATA_URL: "https://placeholder.example.com/realms/platform"
  RHDH_OIDC_CLIENT_SECRET: "PLACEHOLDER"
  RHDH_ARGOCD_URL: "https://placeholder.example.com"
  RHDH_ARGOCD_TOKEN: "PLACEHOLDER"
  RHDH_KUBERNETES_SA_TOKEN: "PLACEHOLDER"
  RHDH_PIPELINE_STARTER_TOKEN: "PLACEHOLDER"
  DOC_GEN_AGENT_URL: "https://placeholder.example.com"
  OPENAPI_GEN_AGENT_URL: "https://placeholder.example.com"
  GOVERNANCE_HUB_URL: "https://placeholder.example.com"
  GITHUB_TOKEN: "PLACEHOLDER"
