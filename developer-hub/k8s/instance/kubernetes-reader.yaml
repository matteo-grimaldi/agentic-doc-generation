# ServiceAccount + token Secret + ClusterRole/Binding for the RHDH
# Kubernetes plugin. RHDH uses this SA token to list/get pods, deployments,
# routes, and Tekton PipelineRuns across all namespaces.
# The operator sets automountServiceAccountToken: false on the Backstage pod,
# so the token is injected via rhdh-secrets instead of the pod's own SA.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhdh-kubernetes-reader
  namespace: rhdh
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
# Long-lived token Secret — needed because the Kubernetes plugin reads the
# token from a Secret reference (not from pod projection).
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-kubernetes-reader-token
  namespace: rhdh
  annotations:
    kubernetes.io/service-account.name: rhdh-kubernetes-reader
    argocd.argoproj.io/sync-wave: "5"
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhdh-kubernetes-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, namespaces, resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns, pipelines, tasks]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhdh-kubernetes-reader
  annotations:
    argocd.argoproj.io/sync-wave: "5"
subjects:
  - kind: ServiceAccount
    name: rhdh-kubernetes-reader
    namespace: rhdh
roleRef:
  kind: ClusterRole
  name: rhdh-kubernetes-reader
  apiGroup: rbac.authorization.k8s.io
