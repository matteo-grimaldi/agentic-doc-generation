# Child Application: deploys the doc-gen agent (Gradio UI + OGX sidecar).
#
# sync-wave 1 — depends on github-mcp-server (needs its Service DNS name)
# from wave 0. Inference goes to an external OpenAI-compatible endpoint
# (configured via the cluster-config ConfigMap and the
# external-model-credentials Secret — see doc-gen-agent/k8s/), so this
# Application has no in-cluster model-serving dependency.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doc-gen-agent
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/agentic-doc-generation.git
    targetRevision: HEAD
    path: doc-gen-agent/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: doc-gen-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
