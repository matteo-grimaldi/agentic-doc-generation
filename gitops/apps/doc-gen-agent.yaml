# Child Application: deploys the doc-gen agent (Gradio UI + OGX sidecar).
#
# sync-wave 1 — depends on github-mcp-server (needs its Service DNS name)
# from wave 0. Inference goes through the in-cluster AI Gateway / MaaS
# (cluster-config model_base_url + external-model-credentials MaaS key;
# see doc-gen-agent/k8s/ and ai-gateway/k8s/). No in-cluster vLLM serving.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doc-gen-agent
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/matteo-grimaldi/agentic-doc-generation.git
    targetRevision: HEAD
    path: doc-gen-agent/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: doc-gen-demo
  # mcp_gateway_url and model_base_url are patched live by install scripts
  # (see doc-gen-agent/k8s/cluster-config.yaml). ignoreDifferences below
  # keeps Argo from reverting those keys for all four agents that share
  # cluster-config.
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: cluster-config
      jsonPointers:
        - /data/mcp_gateway_url
        - /data/model_base_url
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
