# Child Application: deploys the GitHub MCP server that lets the agent
# browse a target repository's structure and file contents.
#
# sync-wave 0 — the first component deployed; just needs the
# doc-gen-demo namespace (declared in github-mcp-server/k8s/namespace.yaml,
# or created here via CreateNamespace=true if it runs first).
#
# PREREQUISITE: github-mcp-server/k8s/mcpserver.yaml is an `MCPServer`
# custom resource (reconciled by RHOAI's mcplifecycleoperator component
# into the actual Deployment/Service/NetworkPolicy, so it shows up under
# AI Hub's "Deployed MCP Servers" tab) — its CRD must already be
# registered before this Application can sync, same as ci-cd-pipeline's
# Tekton CRDs. Run ./install-openshift-ai.sh (imperatively, before
# bootstrapping this GitOps tree) to install it; see
# .cursor/rules/gitops-conventions.mdc.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-mcp-server
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/agentic-doc-generation.git
    targetRevision: HEAD
    path: github-mcp-server/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: doc-gen-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
