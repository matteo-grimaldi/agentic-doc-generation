# DataScienceCluster — turns on only what this demo needs: the dashboard
# (optional, nice for showing the platform) and KServe for model serving
# in RawDeployment mode (no Knative/Service Mesh dependency, matching
# dsci.yaml's serviceMesh: Removed). Everything else is explicitly
# Removed to keep the demo's resource footprint small.
#
# sync-wave 2: applied after DSCInitialization (wave 1).
apiVersion: datasciencecluster.opendatahub.io/v1
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  components:
    dashboard:
      managementState: Managed
    kserve:
      managementState: Managed
      defaultDeploymentMode: RawDeployment
      serving:
        managementState: Removed
    workbenches:
      managementState: Removed
    modelmeshserving:
      managementState: Removed
    datasciencepipelines:
      managementState: Removed
    kueue:
      managementState: Removed
    codeflare:
      managementState: Removed
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
    modelregistry:
      managementState: Removed
    feastoperator:
      managementState: Removed
