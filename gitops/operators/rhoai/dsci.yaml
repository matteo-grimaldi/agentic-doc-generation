# DSCInitialization — cluster-wide RHOAI prerequisites.
#
# serviceMesh is set to Removed: the demo uses KServe RawDeployment mode
# (see dsc.yaml) which does not require Istio/Service Mesh, keeping the
# footprint small for a demo cluster.
#
# sync-wave 1: applied after the operator Subscription (wave 0), once the
# DSCInitialization CRD has been installed by the operator's CSV.
apiVersion: dscinitialization.opendatahub.io/v1
kind: DSCInitialization
metadata:
  name: default-dsci
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  applicationsNamespace: redhat-ods-applications
  monitoring:
    managementState: Managed
    namespace: redhat-ods-monitoring
  serviceMesh:
    managementState: Removed
  trustedCABundle:
    managementState: Managed
    customCABundle: ""
