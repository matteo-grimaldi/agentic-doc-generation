# Root ArgoCD "App-of-Apps".
#
# Applying this single Application bootstraps the entire demo: it tells
# ArgoCD to watch gitops/apps/ and create one child Application per
# component found there (GitHub MCP server, doc-gen agent). Each child
# Application then manages its own Kubernetes resources independently.
# Model inference is NOT provisioned by this repo on this branch — the
# doc-gen agent calls a configurable external OpenAI-compatible endpoint
# (see doc-gen-agent/k8s/cluster-config.yaml). For the original design
# that serves the model in-cluster via vLLM on OpenShift AI (GPU
# required), see the `local-model` branch.
#
# NOTE: `repoURL` below is replaced by gitops/bootstrap.sh with the
# actual git remote URL of this repository before being applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doc-gen-demo-root
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_ORG/agentic-doc-generation.git
    targetRevision: HEAD
    path: gitops/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
