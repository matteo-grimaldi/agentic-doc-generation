# Grants the OpenShift GitOps application-controller permission to reconcile
# demo workloads in target namespaces. Applied imperatively by
# gitops/bootstrap.sh (before the root App-of-Apps) — not managed by ArgoCD,
# because the controller cannot grant itself access.
#
# OpenShift GitOps 1.22+ ships a restricted ClusterRole for the controller
# (get/list/watch on most types). Without these bindings, child Applications
# fail sync with "cannot patch resource … forbidden".
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller-admin
  namespace: doc-gen-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller-admin
  namespace: ci-cd-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
# MCP Gateway Application (wave 0) lands Gateway / AuthPolicy / registrations
# here; without this binding OpenShift GitOps 1.22+ cannot patch them.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller-admin
  namespace: mcp-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
