# Note: the ogx-stack-config and catalog-gen-knowledge ConfigMaps are
# managed by build-and-deploy.sh via:
#   oc create configmap ogx-stack-config --from-file=stack_run_config.yaml=ogx/stack_run_config.yaml
#   oc create configmap catalog-gen-knowledge --from-file=guidelines/
# Do NOT inline them here to avoid YAML-within-YAML parsing issues.
#
# Shares the cluster-config ConfigMap and external-model-credentials
# Secret with doc-gen-agent, openapi-gen-agent, and compliance-scan-agent
# (doc-gen-agent/k8s/cluster-config.yaml) — all four components point at
# the same external OpenAI-compatible endpoint.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-gen-agent
  namespace: doc-gen-demo
  labels:
    app: catalog-gen-agent
    app.kubernetes.io/name: catalog-gen-agent
    app.kubernetes.io/part-of: agentic-doc-generation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-gen-agent
  template:
    metadata:
      labels:
        app: catalog-gen-agent
    spec:
      serviceAccountName: catalog-gen-agent-sa
      containers:
        # ── OGX sidecar ──────────────────────────────────────────────────────
        - name: ogx-server
          image: ogxai/distribution-starter:latest
          imagePullPolicy: Always
          command:
            - uvicorn
            - ogx.core.server.server:create_app
            - --host
            - "0.0.0.0"
            - --port
            - "8321"
            - --factory
          ports:
            - containerPort: 8321
              name: ogx-http
              protocol: TCP
          env:
            - name: OGX_CONFIG
              value: "/etc/ogx/stack_run_config.yaml"
            - name: OGX_LOGGING
              value: "all=INFO"
            - name: SQLITE_STORE_DIR
              value: "/tmp/ogx"
            - name: INFERENCE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: model_base_url
            # Same ~2048-token budget as compliance-scan-agent/
            # openapi-gen-agent — sized to finish within the external
            # endpoint's own fixed ~100s request timeout once Qwen3
            # "thinking" is disabled (see agent.py's CHAT_TEMPLATE_KWARGS).
            # Generating a catalog-info.yaml (classify the repo, look at a
            # handful of manifests, write YAML) is comparable in
            # complexity, so the same budget applies here.
            - name: INFERENCE_MAX_TOKENS
              value: "2048"
            # API key for the external OpenAI-compatible endpoint. Create
            # the Secret with:
            #   oc create secret generic external-model-credentials \
            #     --from-literal=api_key=<your-api-key> -n doc-gen-demo
            # Optional — leave the Secret absent for endpoints that don't
            # require auth; stack_run_config.yaml falls back to "unused".
            - name: INFERENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-model-credentials
                  key: api_key
                  optional: true
            - name: INFERENCE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: model_name
          volumeMounts:
            - name: ogx-config
              mountPath: /etc/ogx
            - name: ogx-data
              mountPath: /tmp/ogx
          livenessProbe:
            httpGet:
              path: /v1/models
              port: 8321
            initialDelaySeconds: 45
            periodSeconds: 20
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8321
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
        # ── Gradio UI ────────────────────────────────────────────────────────
        - name: catalog-gen-agent
          image: image-registry.openshift-image-registry.svc:5000/doc-gen-demo/catalog-gen-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7860
              name: http
              protocol: TCP
          env:
            - name: GRADIO_PORT
              value: "7860"
            - name: GRADIO_ANALYTICS_ENABLED
              value: "False"
            - name: OGX_BASE_URL
              value: "http://localhost:8321"
            - name: GITHUB_MCP_URL
              value: "http://github-mcp-server.doc-gen-demo.svc.cluster.local:8080/mcp"
            # Base URL (no /mcp suffix) of the same GitHub MCP server, used
            # by the zero-model-budget repo-structure pre-classification
            # and by the /invoke background task / "Propose as PR" button
            # to POST the generated catalog-info.yaml to its plain REST
            # /propose-doc route (which opens a PR rather than committing
            # directly) — see app.py.
            - name: GITHUB_MCP_SERVER_URL
              value: "http://github-mcp-server.doc-gen-demo.svc.cluster.local:8080"
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: cluster-config
                  key: model_name
            - name: GUIDELINES_DIR
              value: "/etc/agent-knowledge/guidelines"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MAX_INFER_ITERS
              value: "10"
            - name: MAX_READ_FILES
              value: "6"
            - name: CATALOG_INFO_PATH
              value: "catalog-info.yaml"
            # Optional: the Governance Hub component's callback endpoint
            # (see governance-hub/app.py's POST /api/runs) — leave this
            # empty (or remove the Deployment entirely) to run
            # catalog-gen-agent with no governance tracking at all;
            # reporting failures never affect this agent's own run (see
            # app.py's _report_to_governance).
            - name: GOVERNANCE_HUB_URL
              value: "http://governance-hub.doc-gen-demo.svc.cluster.local:7860"
          livenessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: agent-knowledge
              mountPath: /etc/agent-knowledge/guidelines
              readOnly: true
      volumes:
        - name: ogx-config
          configMap:
            name: ogx-stack-config
        - name: ogx-data
          emptyDir: {}
        - name: agent-knowledge
          configMap:
            name: catalog-gen-knowledge
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-gen-agent
  namespace: doc-gen-demo
  labels:
    app: catalog-gen-agent
spec:
  selector:
    app: catalog-gen-agent
  ports:
    - name: http
      port: 7860
      targetPort: 7860
      protocol: TCP
